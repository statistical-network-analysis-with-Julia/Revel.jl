name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # The siblings are cloned at their current `main`: a nightly run catches a
  # change in Networks.jl, REM.jl or Relevent.jl that breaks this package even
  # when nothing here moved.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  JULIA_NUM_THREADS: 4
  OPENBLAS_NUM_THREADS: 1

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # An upstream regression in Julia nightly is reported, not a red badge
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # The ecosystem requires Julia >= 1.12.
          - '1.12'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          # Apple silicon runs natively (macos-latest is arm64; x64 would run
          # under Rosetta)
          - version: '1.12'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: macos-latest
            arch: aarch64
        exclude:
          - version: 'nightly'
            os: windows-latest
    steps:
      # The packages of the ecosystem are independent repositories that find each other
      # through [sources] path dependencies (`Networks = {path = "../Networks.jl"}`).
      # A lone checkout has no siblings, so those paths dangle and Pkg fails to
      # resolve before a single test runs. Rebuild the layout every developer has
      # locally: this package in a directory named after it, siblings beside it.
      - uses: actions/checkout@v5
        with:
          path: Revel.jl

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Reconstruct source closure from Project.toml files
        shell: bash
        working-directory: Revel.jl
        run: julia .github/scripts/checkout_sources.jl > sibling-revisions.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sibling-revisions-${{ matrix.version }}-${{ matrix.os }}
          path: Revel.jl/sibling-revisions.txt

      - uses: julia-actions/cache@v2

      # Coverage instrumentation slows the suite; only the cell that uploads it
      # pays for it
      - name: Run tests
        shell: bash
        working-directory: Revel.jl
        env:
          COVERAGE: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=ENV["COVERAGE"] == "true")'

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          directories: Revel.jl/src

      - uses: codecov/codecov-action@v5
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Allocation regression gates
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: Revel.jl
        run: |
          julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmark benchmark/regression_tests.jl
